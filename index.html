<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tuaren">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tuaren</title>
<style>
:root{--bg:#000;--card:#1a0b10;--tx:#f5eef0;--sub:#a58b93;--pink:#c0294d;--line:#33151d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 110px}
h1{font-size:32px;margin:14px 0 10px;display:flex;justify-content:space-between;align-items:center}
.plus{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;border:0;font-size:24px}
.card{background:var(--card);border-radius:14px;padding:4px 14px;margin-bottom:16px}
.h{font-size:12px;text-transform:uppercase;color:var(--sub);margin:12px 14px 6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}.sub{color:var(--sub);font-size:12px}.pk{color:var(--pink)}
.big{text-align:center;padding:22px 0}.big b{font-size:64px;color:var(--pink);display:block;line-height:1}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--pink);color:#fff;font-size:16px;margin:8px 0}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.del{border:0;background:none;color:#ff6b6b;font-size:13px}
.chk{border:0;background:none;font-size:24px;padding:0 8px 0 0}
.done{text-decoration:line-through;color:var(--sub)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
#tabs button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:22px}#tabs button.on{color:var(--pink)}
input{width:100%;padding:13px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
#sheet.show{display:flex}.panel{background:#120509;width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
.panel h3{margin:0 0 12px}.btns{display:flex;gap:10px}.btns button{flex:1;padding:13px;border-radius:10px;border:0;font-size:16px;background:var(--card);color:var(--tx)}
.btns .ok{background:var(--pink);color:#fff}
#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;transform:translateY(-150%);transition:transform .35s;z-index:9}
#toast.show{transform:none}
.code{font:600 18px ui-monospace,monospace}
</style></head><body>
<div id="app"></div>
<nav id="tabs" hidden>
  <button data-t="home"><span>🖤</span>Biz</button>
  <button data-t="firsts"><span>⭐</span>İlklerimiz</button>
  <button data-t="plans"><span>📅</span>Planlar</button>
</nav>
<div id="sheet"><div class="panel"><h3 id="sh"></h3>
  <input id="i1" placeholder="Başlık"><input id="i2"><input id="i3" placeholder="Not (isteğe bağlı)">
  <div class="btns"><button id="cancel">Vazgeç</button><button class="ok" id="save">Kaydet</button></div></div></div>
<div id="toast"></div>
<script type="module">
import { FIREBASE, VAPID_PUBLIC } from './config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const db = getFirestore(initializeApp(FIREBASE));
const norm = s => s.trim().toLowerCase().replace(/[\/\s]/g, '');
const DEFAULT = { meet: '2026-05-25', start: '2026-05-31', firsts: [], plans: [] };
let code = localStorage.getItem('code'), ref, data = null, tab = 'home', adding = null, pushOn = false, unsub;

const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3200); }
const d0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const diff = d => Math.round((d0(d) - d0(new Date())) / 864e5);
const local = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = d => new Date(d).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtT = d => new Date(d).toLocaleString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function nextAnn(d, monthly) {
  const n = new Date(); let c = new Date(n.getFullYear(), monthly ? n.getMonth() : d.getMonth(), d.getDate());
  if (d0(c) < d0(n)) c = new Date(c.getFullYear() + (monthly ? 0 : 1), c.getMonth() + (monthly ? 1 : 0), d.getDate());
  return c;
}
const arow = (t, d) => `<div class="row"><span>${t}</span><span><span class="sub">${fmt(d)}</span> <span class="pk">(${diff(d)} gün)</span></span></div>`;

// ---------- Firestore ----------
async function begin(c) {
  code = c; localStorage.setItem('code', c); ref = doc(db, 'couples', c);
  try {
    const s = await getDoc(ref);
    if (!s.exists()) await setDoc(ref, { data: JSON.stringify(DEFAULT), subs: '{}', sent: '[]' });
  } catch (e) { toast('Bağlanılamadı: ' + (e.code || e.message)); return; }
  unsub && unsub();
  unsub = onSnapshot(ref, s => { if (s.exists()) { data = JSON.parse(s.data().data); render(); } }, () => toast('Senkron hatası'));
  checkPush();
}
async function mutate(field, fn) {
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(ref); const v = JSON.parse(s.data()[field] || '{}'); fn(v); tx.update(ref, { [field]: JSON.stringify(v) });
    });
  } catch (e) { toast('Kaydedilemedi. İnternetini kontrol et.'); }
}

// ---------- Bildirim ----------
const b64 = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function checkPush() {
  pushOn = false;
  if (canPush) { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); pushOn = !!sub && Notification.permission === 'granted'; }
  render();
}
async function enablePush() {
  try {
    if (await Notification.requestPermission() !== 'granted') return toast('Bildirim izni verilmedi. Ayarlar > Bildirimler > Tuaren');
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) });
    const id = sub.endpoint.replace(/[^a-zA-Z0-9]/g, '').slice(-24);
    await mutate('subs', v => { v[id] = sub.toJSON(); });
    toast('Bildirimler açıldı 🖤'); checkPush();
  } catch (e) { toast('Açılamadı: ' + e.message); }
}
async function testPush() {
  const reg = await navigator.serviceWorker.ready;
  reg.showNotification('Tuaren 🖤', { body: 'Bildirimler bu telefonda çalışıyor!', icon: 'icon-192.png' });
}

// ---------- Ekranlar ----------
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#tabs').hidden = !code;
  const app = $('#app');
  if (!code) {
    app.innerHTML = `<h1>Tuaren 🖤</h1><div class="card" style="padding:16px"><p>İkiniz de <b>aynı ortak şifreyi</b> yazın (en az 6 harf/rakam, sadece ikinizin bileceği bir şey). Böylece telefonlarınız eşleşir.</p>
      <input id="code" placeholder="Ortak şifre" autocapitalize="none" autocomplete="off"><button class="btn" id="join">Devam</button></div>`;
    return;
  }
  if (!data) { app.innerHTML = '<h1>Tuaren 🖤</h1><p class="sub">Yükleniyor…</p>'; return; }
  const s = local(data.start), m = local(data.meet);
  let h = '';
  if (tab === 'home') {
    let push;
    if (!canPush) push = `<p>Bildirim için bu sayfayı <b>Ana Ekrana eklemelisin</b>: Safari'de alttaki <b>Paylaş</b> ⬆️ düğmesi → <b>Ana Ekrana Ekle</b>. Sonra uygulamayı ana ekrandaki simgeden aç. (iOS 16.4 veya üstü gerekir.)</p>`;
    else if (!pushOn) push = `<button class="btn" id="enable">🔔 Bildirimleri aç</button><p class="sub">Önemli günlerde ve plan gününde bu telefona bildirim gelir.</p>`;
    else push = `<p>✅ Bildirimler bu telefonda açık</p><button class="btn ghost" id="test">Bu telefonda test et</button>`;
    h = `<h1>Tuaren</h1><div class="card big"><b>${Math.max(0, -diff(s))}</b>gündür birlikteyiz 🖤</div>
      <div class="h">Sıradaki özel günler</div><div class="card">${arow('Ay dönümü', nextAnn(s, true))}${arow('Yıl dönümü', nextAnn(s, false))}${arow('Tanışma yıl dönümü', nextAnn(m, false))}</div>
      <div class="h">Tarihler</div><div class="card"><div class="row"><span>Tanışma</span><span class="sub">${fmt(m)}</span></div><div class="row"><span>Sevgili olma</span><span class="sub">${fmt(s)}</span></div></div>
      <div class="h">Bildirimler</div><div class="card" style="padding:10px 14px">${push}</div>
      <div class="h">Ortak şifre</div><div class="card"><div class="row"><span class="code">${esc(code)}</span><button class="del" id="leave" style="color:var(--sub)">Çıkış</button></div></div>`;
  } else if (tab === 'firsts') {
    const l = [...data.firsts].sort((a, b) => b.d.localeCompare(a.d));
    h = `<h1>İlklerimiz <button class="plus" data-add="firsts">+</button></h1><div class="card">${l.map(f => `<div class="row"><div><b>${esc(f.t)}</b><div class="sub">${fmt(local(f.d))}${f.n ? ' · ' + esc(f.n) : ''}</div></div><button class="del" data-df="${f.id}">Sil</button></div>`).join('') || '<p class="sub">Henüz yok. + ile ekle.</p>'}</div>`;
  } else {
    const l = [...data.plans].sort((a, b) => a.date.localeCompare(b.date));
    h = `<h1>Planlar <button class="plus" data-add="plans">+</button></h1><div class="card">${l.map(p => `<div class="row"><div style="display:flex;align-items:center"><button class="chk" data-tp="${p.id}">${p.done ? '✅' : '⚪'}</button><div><div class="${p.done ? 'done' : ''}">${esc(p.t)}</div><div class="sub">${fmtT(p.date)}</div></div></div><button class="del" data-dp="${p.id}">Sil</button></div>`).join('') || '<p class="sub">Henüz plan yok. + ile ekle.</p>'}</div>`;
  }
  app.innerHTML = h;
}

// ---------- Olaylar ----------
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0, 0); });
document.addEventListener('click', e => {
  const t = e.target, id = t.id, ds = t.dataset;
  if (id === 'join') { const c = norm($('#code').value); if (c.length < 6) return toast('En az 6 karakter yaz'); begin(c); }
  else if (id === 'enable') enablePush();
  else if (id === 'test') testPush();
  else if (id === 'leave') { if (confirm('Bu telefonda çıkış yapılsın mı?')) { localStorage.removeItem('code'); location.reload(); } }
  else if (ds.add) {
    adding = ds.add; $('#sh').textContent = adding === 'firsts' ? 'Yeni ilk' : 'Yeni plan';
    $('#i1').value = ''; $('#i3').value = ''; $('#i3').style.display = adding === 'firsts' ? '' : 'none';
    const now = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString();
    $('#i2').type = adding === 'firsts' ? 'date' : 'datetime-local'; $('#i2').value = adding === 'firsts' ? now.slice(0, 10) : now.slice(0, 16);
    $('#sheet').classList.add('show');
  }
  else if (ds.df) mutate('data', v => { v.firsts = v.firsts.filter(x => x.id !== ds.df); });
  else if (ds.dp) mutate('data', v => { v.plans = v.plans.filter(x => x.id !== ds.dp); });
  else if (ds.tp) mutate('data', v => { const p = v.plans.find(x => x.id === ds.tp); if (p) p.done = !p.done; });
});
$('#cancel').onclick = () => $('#sheet').classList.remove('show');
$('#save').onclick = async () => {
  const t = $('#i1').value.trim(), v = $('#i2').value; if (!t || !v) return toast('Başlık ve tarih gerekli');
  const id = crypto.randomUUID().slice(0, 8);
  $('#sheet').classList.remove('show');
  if (adding === 'firsts') await mutate('data', d => d.firsts.push({ id, t, d: v, n: $('#i3').value.trim() }));
  else await mutate('data', d => d.plans.push({ id, t, date: new Date(v).toISOString(), done: false }));
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
render();
if (code) begin(code);
</script></body></html>
